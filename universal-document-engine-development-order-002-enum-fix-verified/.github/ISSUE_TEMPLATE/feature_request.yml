name: Feature request
description: Propose a scoped capability or improvement.
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operational problem, not only a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope and non-goals
    validations:
      required: true
  - type: dropdown
    id: tenant-impact
    attributes:
      label: Tenant-isolation impact
      options:
        - Unknown — requires design review
        - None
        - Tenant-owned data or behavior
        - System administration
    validations:
      required: true
  - type: dropdown
    id: legal-review
    attributes:
      label: Legally relevant output impact
      options:
        - Unknown — requires design review
        - None
        - Requires human-review workflow
    validations:
      required: true
