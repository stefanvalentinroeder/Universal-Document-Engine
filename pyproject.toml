[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "universal-document-engine-backend"
version = "0.1.0"
description = "Backend foundation for the Universal Document Engine."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
dependencies = [
  "alembic==1.16.4",
  "asyncpg==0.30.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "pydantic-settings==2.10.1",
  "sqlalchemy[asyncio]==2.0.41",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "mypy==1.17.0",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.5",
]

[tool.uv]
required-version = "==0.11.33"
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = [
  "apps/api/ude_api",
  "libs/backend/core/src/ude_backend_core",
  "libs/backend/db/src/ude_backend_db",
  "libs/backend/tenancy/src/ude_backend_tenancy",
]

[tool.hatch.build.targets.sdist]
include = [
  "apps/api/ude_api",
  "libs/backend",
  "pyproject.toml",
  "README.md",
  "LICENSE",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "tests/integration"]
pythonpath = [
  "apps/api",
  "libs/backend/core/src",
  "libs/backend/db/src",
  "libs/backend/tenancy/src",
]
markers = [
  "integration: tests requiring local infrastructure",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["apps/api/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"apps/api/migrations/*.py" = ["INP001"]
"apps/api/tests/*.py" = ["S101"]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = [
  "ude_api",
  "ude_backend_core",
  "ude_backend_db",
  "ude_backend_tenancy",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = [
  "apps/api/ude_api",
  "apps/api/tests",
  "libs/backend/core/src",
  "libs/backend/db/src",
  "libs/backend/tenancy/src",
  "tools/scripts/validate_api.py",
]
exclude = ["apps/api/migrations"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true
