name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NX_CLOUD: 'false'
      NX_DAEMON: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 11.7.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v6.6.1
        with:
          version: 0.11.33
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: pnpm format:check

      - name: Lint TypeScript and Python
        run: pnpm lint

      - name: Run TypeScript and Python tests
        run: pnpm test

      - name: Build applications and backend package
        run: pnpm build

      - name: Validate FastAPI factory and OpenAPI
        run: pnpm api:validate

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Check committed files for common secrets
        run: pnpm check:secrets

      - name: Exercise Nx affected lint targets
        if: github.event_name == 'pull_request'
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha }}
          NX_HEAD: ${{ github.sha }}
        run: pnpm nx affected -t lint --base="$NX_BASE" --head="$NX_HEAD" --parallel=3

  integration:
    name: integration
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NX_CLOUD: 'false'
      NX_DAEMON: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 11.7.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v6.6.1
        with:
          version: 0.11.33
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run isolated PostgreSQL and MinIO integration verification
        run: pnpm test:infra
