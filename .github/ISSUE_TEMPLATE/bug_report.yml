name: Bug report
description: Report a reproducible defect without including sensitive data.
title: 'fix: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, client documents, personal data, or security vulnerabilities.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Safe reproduction steps
      description: Use synthetic data only.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser, and relevant tool versions.
    validations:
      required: true
